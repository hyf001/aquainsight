<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="45" fill="url(#grad)" opacity="0.2"/>
  <path d="M30 55 C30 40, 40 30, 50 35 C60 40, 70 50, 70 55 C70 65, 60 75, 50 70 C40 65, 30 70, 30 55"
        fill="none" stroke="url(#grad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="50" cy="52" r="3" fill="#06b6d4" filter="url(#glow)"/>
  <circle cx="35" cy="50" r="2" fill="#22d3ee" opacity="0.8"/>
  <circle cx="65" cy="55" r="2" fill="#22d3ee" opacity="0.8"/>
  <circle cx="45" cy="62" r="1.5" fill="#22d3ee" opacity="0.6"/>
</svg>
